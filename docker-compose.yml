version: '3.8'

services:
  omniclip-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniclip-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=file:/app/data/omniclip.db
    volumes:
      - omniclip-data:/app/data
      - omniclip-cache:/app/data/cache
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: omniclip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  omniclip-data:
  omniclip-cache:
  redis-data:
